<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 SUPER SLOTS SULTAN 777 | Spin & Pukul Clicker</title>
    <meta name="description" content="Mesin slot 3 reel interaktif bling-bling. Kumpulkan token dengan klik Pukul Prabowo, raih 3 match buah, berlian, dan jackpot uang koin!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Orbitron:wght@700;900&family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Bling-Bling Sparkling Ambient Background -->
    <div class="casino-bg">
        <div class="light-beams"></div>
        <div class="sparkles-container" id="sparklesLayer"></div>
    </div>

    <!-- Main 100vh App Canvas (No Scroll) -->
    <div class="casino-container">
        <!-- Top Status Bar -->
        <header class="top-bar">
            <div class="logo-box">
                <span class="bling-crown">👑</span>
                <h1 class="casino-title">SUPER SLOTS <span>777</span></h1>
            </div>
            
            <div class="stats-ribbon">
                <div class="stat-pill coin-pill">
                    <span class="pill-icon">💰</span>
                    <div class="pill-data">
                        <span class="pill-title">SALDO KOIN</span>
                        <span class="pill-val" id="coinBalance">1,000</span>
                    </div>
                </div>

                <div class="stat-pill token-pill">
                    <span class="pill-icon">🎟️</span>
                    <div class="pill-data">
                        <span class="pill-title">TIKET SPIN</span>
                        <span class="pill-val token-val" id="tokenBalance">1</span>
                    </div>
                </div>

                <button id="soundToggleBtn" class="sound-chip" title="Toggle Sound">
                    <span id="soundIcon">🔊</span>
                </button>
            </div>
        </header>

        <!-- Notification Banner / Win announcement -->
        <div class="win-banner" id="winBanner">
            <span class="banner-text" id="bannerText">✨ KLIK "PUKUL PRABOWO" BUAT CARI TIKET SPIN! ✨</span>
        </div>

        <!-- 3-MATCH SLOT MACHINE -->
        <section class="slot-cabinet">
            <!-- Machine Neon Frame -->
            <div class="slot-frame">
                <!-- Bulbs on top -->
                <div class="bulb-row">
                    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
                    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
                    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
                </div>

                <!-- 3 Reels Display -->
                <div class="reels-window">
                    <div class="payline-laser"></div>
                    
                    <!-- Reel 1 -->
                    <div class="reel-box" id="reel-0">
                        <div class="reel-strip" id="strip-0">
                            <div class="slot-item">💎</div>
                        </div>
                    </div>

                    <!-- Reel 2 -->
                    <div class="reel-box" id="reel-1">
                        <div class="reel-strip" id="strip-1">
                            <div class="slot-item">7️⃣</div>
                        </div>
                    </div>

                    <!-- Reel 3 -->
                    <div class="reel-box" id="reel-2">
                        <div class="reel-strip" id="strip-2">
                            <div class="slot-item">💎</div>
                        </div>
                    </div>
                </div>

                <!-- Machine Glass Reflection Effect -->
                <div class="cabinet-glare"></div>
            </div>
        </section>

        <!-- Interactive Controls Split: Clicker vs Spin Button -->
        <main class="controls-deck">
            <!-- Left Card: Pukul Prabowo Clicker -->
            <div class="clicker-card">
                <div class="clicker-header">
                    <span class="clicker-badge">🥊 GENERATOR TOKEN</span>
                    <span class="click-ratio" id="clickCounterDisplay">0 / 5 KLIK</span>
                </div>

                <!-- Progress Bar towards 1 Spin Token -->
                <div class="token-progress-track">
                    <div class="token-progress-bar" id="progressBar" style="width: 0%;"></div>
                </div>

                <!-- The Big Punch Button -->
                <button class="punch-btn" id="punchBtn">
                    <div class="punch-avatar-wrap">
                        <span class="punch-avatar" id="punchAvatar">🥊</span>
                        <div class="punch-ripple" id="punchRipple"></div>
                    </div>
                    <div class="punch-btn-text">
                        <span class="punch-main-txt">PUKUL PRABOWO</span>
                        <span class="punch-sub-txt">5x Klik = +1 Tiket Spin!</span>
                    </div>
                </button>
            </div>

            <!-- Right Card: Spin Action & Combos -->
            <div class="spin-card">
                <button class="spin-master-btn" id="spinBtn">
                    <div class="spin-btn-shine"></div>
                    <span class="spin-btn-icon">🎰</span>
                    <span class="spin-btn-title">PUTAR SPIN</span>
                    <span class="spin-btn-cost">PAKAI 1 TIKET 🎟️</span>
                </button>
            </div>
        </main>

        <!-- Paytable Mini Hint Footer -->
        <footer class="paytable-strip">
            <span class="pay-item">7️⃣7️⃣7️⃣ = <strong>+10,000</strong></span>
            <span class="pay-item">💎💎💎 = <strong>+5,000</strong></span>
            <span class="pay-item">💰💰💰 = <strong>+2,500</strong></span>
            <span class="pay-item">🍉🍉🍉 = <strong>+1,000</strong></span>
            <span class="pay-item">🍋🍋🍋 = <strong>+500</strong></span>
            <span class="pay-item">🍒🍒🍒 = <strong>+300</strong></span>
        </footer>
    </div>

    <!-- Celebration Fullscreen Particle / Coin Blast Overlay -->
    <div class="jackpot-overlay" id="jackpotOverlay">
        <div class="jackpot-box">
            <div class="jackpot-crown">👑 💰 👑</div>
            <h2 class="jackpot-title" id="jackpotTitle">MEGA JACKPOT!</h2>
            <div class="jackpot-prize" id="jackpotPrize">+10,000 KOIN</div>
            <p class="jackpot-sub">MENANG 3 MATCH SULTAN BERKILAU!</p>
            <button class="collect-btn" id="collectBtn">AMBIL HADIAH 💸</button>
        </div>
    </div>

    <!-- Floating Coin FX Layer -->
    <div id="coinBlastLayer" class="coin-blast-layer"></div>

    <script src="script.js"></script>
</body>
</html>
